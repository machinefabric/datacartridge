# datacartridge's error type and clocks: the base the series steps and marketcartridge's
# own crates are built on.
[package]
name = "datacartridge-core"
publish = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[lints]
workspace = true
