# Copied from MarketOS (crates/mos-core), as are its sources: the modules the series steps use.
[package]
name = "mos-core"
publish = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[lints]
workspace = true
