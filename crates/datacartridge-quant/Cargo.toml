# datacartridge's statistics, linear algebra, option maths and pipeline steps, which
# marketcartridge takes from here.
[package]
name = "datacartridge-quant"
publish = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
datacartridge-core = { version = "0.1.0", path = "../datacartridge-core" }
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true
