# datacartridge's forecast scoring and trials are decided by code generated from the proved
# model in formal/ (Lean), checked in under crates/mos-formal/src/generated. The modules are
# MarketOS's, copied unchanged.
#
# Regenerate after changing the model: `lungo generate` here. `lungo generate --verify` fails
# when the checked-in copy is not what the model generates.
project = "formal"

[lean]
root-modules = ["Mos"]
export-modules = ["Mos.Forecast", "Mos.Hindcast"]
deny-sorry = true
deny-axioms = true
deny-unsafe = true

# Every function the cartridge calls carries a proved claim.
[assurance]
require-claims = ["."]

[rust]
out-dir = "crates/mos-formal/src/generated"
# As MarketOS's build shapes them (crates/mos-formal/build.rs), so the copied code uses them unchanged.
type-attributes = [
  { path = ".", attribute = "#[derive(serde::Serialize, serde::Deserialize)]" },
]
enum-attributes = [
  { path = ".", attribute = "#[serde(rename_all = \"snake_case\")]" },
  { path = "Mos.Forecast.Window", attribute = "#[derive(Copy)]" },
  { path = "Mos.Forecast.Outcome", attribute = "#[derive(Copy)]" },
  { path = "Mos.Forecast.Leave", attribute = "#[derive(Copy)]" },
  { path = "Mos.Forecast.Hearing", attribute = "#[derive(Copy)]" },
  { path = "Mos.Forecast.Trend", attribute = "#[derive(Copy)]" },
  { path = "Mos.Forecast.Clash", attribute = "#[derive(Copy)]" },
  { path = "Mos.Forecast.Sureness", attribute = "#[derive(Copy)]" },
  { path = "Mos.Hindcast.HeldUp", attribute = "#[derive(Copy)]" },
]
