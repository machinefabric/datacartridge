# datacartridge's forecast scoring and trials are decided by code generated from the proved
# model in formal/ (Lean), checked in under crates/datacartridge-formal/src/generated.
#
# Regenerate after changing the model: `lungo generate` here. `lungo generate --verify` fails
# when the checked-in copy is not what the model generates.
project = "formal"

[lean]
root-modules = ["Datacartridge"]
export-modules = ["Datacartridge.Forecast", "Datacartridge.Hindcast"]
deny-sorry = true
deny-axioms = true
deny-unsafe = true

# Every function the cartridge calls carries a proved claim.
[assurance]
require-claims = ["."]

[rust]
out-dir = "crates/datacartridge-formal/src/generated"
# The shapes the calling code uses: serde on every type, Copy on the small enums.
type-attributes = [
  { path = ".", attribute = "#[derive(serde::Serialize, serde::Deserialize)]" },
]
enum-attributes = [
  { path = ".", attribute = "#[serde(rename_all = \"snake_case\")]" },
  { path = "Datacartridge.Forecast.Window", attribute = "#[derive(Copy)]" },
  { path = "Datacartridge.Forecast.Outcome", attribute = "#[derive(Copy)]" },
  { path = "Datacartridge.Forecast.Leave", attribute = "#[derive(Copy)]" },
  { path = "Datacartridge.Forecast.Hearing", attribute = "#[derive(Copy)]" },
  { path = "Datacartridge.Forecast.Trend", attribute = "#[derive(Copy)]" },
  { path = "Datacartridge.Forecast.Clash", attribute = "#[derive(Copy)]" },
  { path = "Datacartridge.Forecast.Sureness", attribute = "#[derive(Copy)]" },
  { path = "Datacartridge.Hindcast.HeldUp", attribute = "#[derive(Copy)]" },
]
