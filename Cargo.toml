[package]
name = "datacartridge"
version = "0.1.0"
edition = "2021"
description = "JSON/YAML/CSV format conversion cartridge"

[[bin]]
name = "datacartridge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ciborium = "0.2"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"

[dependencies.capdag]
path = "../capdag"

[dependencies.machfab-plugin-sdk]
path = "../machfab-plugin-sdk"
