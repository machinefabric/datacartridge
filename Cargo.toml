[package]
name = "datacartridge"
version = "0.2.9"
edition = "2021"
description = "Data format conversion and type coercion cartridge"

[[bin]]
name = "datacartridge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ciborium = "0.2"
csv = "1.3"
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"

[dependencies.capdag]
path = "../capdag"
