[package]
name = "datacartridge"
version = "1.115.370"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "JSON/YAML/CSV format conversion cartridge for CapDAG"

[[bin]]
name = "datacartridge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ciborium = "0.2"
csv = "1.3"
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"

[dependencies.capdag]
git = "https://github.com/machinefabric/capdag-rs"
tag = "v1.710.0"

[dependencies.capdag-cartridge-sdk]
git = "https://github.com/machinefabric/capdag-cartridge-sdk-rs"
tag = "v1.146.0"

[dependencies.serde]
features = ["derive"]
version = "1.0"
