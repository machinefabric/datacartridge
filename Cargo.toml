[package]
name = "datacartridge"
version = "1.106.352"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "JSON/YAML/CSV format conversion cartridge for CapDAG"

[[bin]]
name = "datacartridge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ciborium = "0.2"
csv = "1.3"
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"

[dependencies.capdag]
# MFR_LOCAL_LIBS was set when this was rendered: the working copy in this
# workspace rather than a published tag. Re-render without it before
# committing or releasing — a path resolves on this machine only.
path = "../../capdag/capdag-rs"

[dependencies.capdag-cartridge-sdk]
# MFR_LOCAL_LIBS was set when this was rendered: the working copy in this
# workspace rather than a published tag. Re-render without it before
# committing or releasing — a path crosses out of this repository and
# resolves on a machine that has the whole workspace checked out.
path = "../../cartridge-sdks/capdag-cartridge-sdk-rs"

[dependencies.serde]
features = ["derive"]
version = "1.0"
